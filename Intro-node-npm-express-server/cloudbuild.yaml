# Google Cloud Build configuration for React + Express app

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/intro-node-express-app:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/intro-node-express-app:latest'
      - '.'
    timeout: '600s'

  # Step 2: Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/intro-node-express-app:$COMMIT_SHA'

  # Step 3: Push the latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/intro-node-express-app:latest'

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'intro-node-express-app'
      - '--image=gcr.io/$PROJECT_ID/intro-node-express-app:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=NODE_ENV=production'
      # Add MongoDB URI as secret (configure in Cloud Console)
      # - '--set-secrets=MONGODB_URI=mongodb-uri:latest'
    timeout: '600s'

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/intro-node-express-app:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/intro-node-express-app:latest'

# Build options
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  
# Timeout for entire build
timeout: '1200s'

